name: Update Activity Graph

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-activity-graph
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Activity Graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          TOKEN: ${{ secrets.TOKEN }}
          USERNAME: ringo-1234
          THEME: tokyonight
          FILENAME: profile-activity-graph.svg

      - name: Commit & Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add profile-activity-graph.svg
          git commit -m "Update activity graph" || exit 0
          git push
